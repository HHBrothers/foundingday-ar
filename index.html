<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AZM AR Experience</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--blue:#1f2adf;--cyan:#00b7ff;--green:#89d957;--dark:#04060f;}
  body{background:var(--dark);color:#fff;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100vh;width:100vw;}
  #landing{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,183,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,183,255,.06) 1px,transparent 1px);background-size:44px 44px;animation:gridMove 10s linear infinite;pointer-events:none;}
  @keyframes gridMove{from{background-position:0 0}to{background-position:44px 44px}}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;}
  .orb1{width:400px;height:400px;background:var(--blue);top:-100px;left:-100px;opacity:.3;animation:op 5s ease-in-out infinite alternate;}
  .orb2{width:280px;height:280px;background:var(--cyan);bottom:-80px;right:-80px;opacity:.2;animation:op 5s ease-in-out infinite alternate;animation-delay:2s;}
  @keyframes op{from{opacity:.15}to{opacity:.35}}
  .logo-wrap{position:relative;text-align:center;opacity:0;animation:fadeUp .7s ease .3s forwards;}
  .logo-azm{font-family:'Bebas Neue',sans-serif;font-size:clamp(100px,24vw,190px);line-height:.88;letter-spacing:6px;background:linear-gradient(135deg,var(--blue) 0%,var(--cyan) 50%,var(--green) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 40px rgba(0,183,255,.4));}
  .logo-sub{font-size:12px;letter-spacing:5px;color:rgba(255,255,255,.3);margin-top:4px;}
  .logo-ar-tag{position:absolute;top:10px;right:-38px;font-size:10px;color:var(--green);letter-spacing:2px;border:1px solid var(--green);padding:2px 7px;animation:blink 1.8s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .tagline{font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.4);margin-top:14px;opacity:0;animation:fadeUp .7s ease .5s forwards;}
  .btn-row{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:40px;opacity:0;animation:fadeUp .7s ease .7s forwards;}
  .start-btn{padding:18px 60px;background:transparent;border:2px solid var(--cyan);color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:all .3s;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);display:inline-block;text-align:center;text-decoration:none;}
  .start-btn:hover{background:var(--cyan);color:var(--dark);box-shadow:0 0 40px var(--cyan);}
  .ios-btn{padding:18px 60px;background:transparent;border:2px solid var(--green);color:var(--green);font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:all .3s;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);display:inline-block;text-align:center;text-decoration:none;}
  .ios-btn:hover{background:var(--green);color:var(--dark);box-shadow:0 0 40px var(--green);}
  .device-label{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.25);text-align:center;}
  .disclaimer{position:absolute;bottom:24px;font-size:10px;color:rgba(255,255,255,.15);letter-spacing:1px;text-align:center;padding:0 20px;line-height:1.8;opacity:0;animation:fadeUp .7s ease .9s forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  /* AR OVERLAY */
  #arOverlay{position:fixed;inset:0;display:none;z-index:50;pointer-events:none;}
  #arOverlay .interactive{pointer-events:all;}
  .hud-corner{position:absolute;width:26px;height:26px;border-color:var(--cyan);border-style:solid;opacity:.5;}
  .hud-corner.tl{top:18px;left:18px;border-width:2px 0 0 2px;}
  .hud-corner.tr{top:18px;right:18px;border-width:2px 2px 0 0;}
  .hud-corner.bl{bottom:18px;left:18px;border-width:0 0 2px 2px;}
  .hud-corner.br{bottom:18px;right:18px;border-width:0 2px 2px 0;}
  .hud-top{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;}
  .hud-brand{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:6px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .hud-status{font-size:10px;letter-spacing:3px;color:var(--cyan);background:rgba(0,183,255,.07);border:1px solid rgba(0,183,255,.2);padding:5px 16px;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);text-transform:uppercase;white-space:nowrap;}
  .scanning-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 3s linear infinite;opacity:.3;}
  @keyframes scan{0%{top:0%;opacity:0}5%{opacity:.3}95%{opacity:.3}100%{top:100%;opacity:0}}
  .reticle-hint{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.45);text-transform:uppercase;text-align:center;white-space:nowrap;}
  .place-wrap{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;}
  .place-btn{padding:18px 64px;background:var(--cyan);color:var(--dark);font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:5px;text-transform:uppercase;border:none;cursor:pointer;clip-path:polygon(14px 0%,100% 0%,calc(100% - 14px) 100%,0% 100%);transition:all .2s;box-shadow:0 0 30px rgba(0,183,255,.4);}
  .place-btn:disabled{background:rgba(0,183,255,.15);color:rgba(255,255,255,.25);box-shadow:none;cursor:not-allowed;}
  .back-btn{position:absolute;top:18px;left:18px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.55);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(10px);transition:all .2s;}
  .back-btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .placed-badge{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.4);}

  /* ERROR MODAL */
  #errorModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;backdrop-filter:blur(10px);}
  #errorModal h2{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--cyan);}
  #errorModal .err-msg{font-size:12px;color:rgba(255,255,255,.6);letter-spacing:1px;line-height:2;max-width:340px;}
  #errorModal .err-detail{font-size:10px;color:rgba(255,255,255,.25);margin-top:4px;max-width:340px;line-height:1.8;}
  #errorModal .err-back{padding:14px 40px;background:transparent;border:2px solid var(--cyan);color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:3px;cursor:pointer;margin-top:8px;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);}
</style>
</head>
<body>

<div id="landing">
  <div class="grid-bg"></div>
  <div class="orb orb1"></div><div class="orb orb2"></div>
  <div class="logo-wrap">
    <div class="logo-azm">AZM</div>
    <div class="logo-ar-tag">AR</div>
    <div class="logo-sub">AUGMENTED REALITY</div>
  </div>
  <div class="tagline">point at a surface · press place</div>
  <div class="btn-row" id="btnRow"></div>
  <div class="disclaimer" id="disclaimer"></div>
</div>

<div id="arOverlay">
  <div class="hud-corner tl"></div><div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div><div class="hud-corner br"></div>
  <div class="scanning-line"></div>
  <div class="hud-top">
    <div class="hud-brand">AZM</div>
    <div class="hud-status" id="statusText">Move camera to detect surface</div>
  </div>
  <div class="reticle-hint" id="reticleHint">Searching for surface...</div>
  <button class="back-btn interactive" id="backBtn">← BACK</button>
  <div class="place-wrap interactive">
    <div class="placed-badge" id="placedBadge"></div>
    <button class="place-btn" id="placeBtn" disabled>PLACE</button>
  </div>
</div>

<div id="errorModal">
  <h2>AR Unavailable</h2>
  <div class="err-msg" id="errMsg"></div>
  <div class="err-detail" id="errDetail"></div>
  <button class="err-back" onclick="closeError()">← BACK</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
var isAndroid = /Android/.test(navigator.userAgent);
var hasXR = !!navigator.xr;

var btnRow = document.getElementById('btnRow');
var disclaimer = document.getElementById('disclaimer');

if (isIOS) {
  // iOS: use AR Quick Look
  btnRow.innerHTML =
    '<span class="device-label">iOS · tap to open in AR</span>' +
    '<a class="ios-btn" href="base_basic_shaded.usdz" rel="ar">🔺 Launch AR</a>';
  disclaimer.textContent = 'Opens Apple AR Quick Look · iOS 13+ Safari';
} else if (isAndroid) {
  // Android: try WebXR, fall back to Scene Viewer (Google AR)
  btnRow.innerHTML =
    '<span class="device-label">Android · Chrome AR</span>' +
    '<button class="start-btn" id="startBtn">🔷 Launch AR</button>' +
    '<a class="ios-btn" id="sceneViewerBtn" href="#" style="font-size:11px;padding:12px 40px;">or open in Google AR</a>';
  disclaimer.textContent = 'Requires ARCore · Android 7+ · Chrome';

  // Scene Viewer (Google AR) deep link - works on any Android without WebXR
  var sceneViewerUrl = 'intent://arvr.google.com/scene-viewer/1.0?file=https://hhbrothers.github.io/foundingday-ar/base_basic_shaded.glb&mode=ar_preferred#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=https://hhbrothers.github.io/foundingday-ar;end;';
  document.addEventListener('DOMContentLoaded', function() {
    var svBtn = document.getElementById('sceneViewerBtn');
    if (svBtn) svBtn.href = sceneViewerUrl;
    var sb = document.getElementById('startBtn');
    if (sb) sb.addEventListener('click', startAR);
  });
} else {
  // Desktop or unknown
  btnRow.innerHTML =
    '<span class="device-label">Open on your phone for AR</span>' +
    '<button class="start-btn" id="startBtn">Launch AR</button>';
  disclaimer.textContent = 'Best on Android Chrome or iOS Safari';
  document.addEventListener('DOMContentLoaded', function() {
    var sb = document.getElementById('startBtn');
    if (sb) sb.addEventListener('click', startAR);
  });
}

document.getElementById('backBtn').addEventListener('click', endAR);
document.getElementById('placeBtn').addEventListener('click', placeModel);

/* ── WebXR ── */
var renderer, scene, camera3d, reticle;
var hitTestSource = null, hitTestSourceRequested = false;
var loadedModel = null, placedCount = 0, xrSession = null;
var clock, placedObjects = [], surfaceFound = false;

if (!isIOS) {
  var gltfLoader = new THREE.GLTFLoader();
  gltfLoader.load('base_basic_shaded.glb', function(gltf) {
    loadedModel = gltf.scene;
    var box = new THREE.Box3().setFromObject(loadedModel);
    var size = new THREE.Vector3(); box.getSize(size);
    var maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) loadedModel.scale.setScalar(1.2 / maxDim);
  }, undefined, function(err) { console.error('GLB error:', err); });
}

function startAR() {
  if (!navigator.xr) {
    showError('WebXR Not Found', 'Your browser does not support WebXR.', 'Try: Android Chrome 81+ with ARCore installed. Go to Play Store and install "Google Play Services for AR".');
    return;
  }
  navigator.xr.isSessionSupported('immersive-ar').then(function(supported) {
    if (!supported) {
      showError('AR Not Supported', 'Your device or browser does not support immersive AR.', 'Make sure ARCore is installed from the Play Store. Try the "Google AR" button instead.');
      return;
    }
    document.getElementById('landing').style.display = 'none';
    launchXR();
  }).catch(function(err) {
    showError('AR Check Failed', 'Could not check AR support.', err.message || 'Unknown error');
  });
}

function launchXR() {
  clock = new THREE.Clock();
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.domElement.style.cssText = 'position:fixed;inset:0;z-index:40;';
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera3d = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
  scene.add(new THREE.AmbientLight(0xffffff, 1.4));
  var d1 = new THREE.DirectionalLight(0x00b7ff, 1.5); d1.position.set(1,3,2); scene.add(d1);
  var d2 = new THREE.DirectionalLight(0x89d957, 0.8); d2.position.set(-2,1,-1); scene.add(d2);

  var rGeo = new THREE.RingGeometry(0.08, 0.13, 32);
  rGeo.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI / 2));
  reticle = new THREE.Mesh(rGeo, new THREE.MeshBasicMaterial({ color:0x00b7ff, transparent:true, opacity:0.9, side:THREE.DoubleSide }));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);
  var dGeo = new THREE.CircleGeometry(0.04, 32);
  dGeo.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI / 2));
  reticle.add(new THREE.Mesh(dGeo, new THREE.MeshBasicMaterial({ color:0x89d957, transparent:true, opacity:0.7, side:THREE.DoubleSide })));

  navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-testing'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.getElementById('arOverlay') }
  }).then(function(session) {
    xrSession = session;
    renderer.xr.setReferenceSpaceType('local');
    renderer.xr.setSession(session).then(function() {
      document.getElementById('arOverlay').style.display = 'block';
      setStatus('Move camera to detect surface');
      renderer.setAnimationLoop(onXRFrame);
    });
    session.addEventListener('end', function() {
      document.getElementById('arOverlay').style.display = 'none';
      if (renderer && renderer.domElement) renderer.domElement.remove();
      renderer.setAnimationLoop(null);
    });
  }).catch(function(err) {
    if (renderer && renderer.domElement) renderer.domElement.remove();
    showError('Session Failed', 'Could not start AR session.', err.message || String(err));
  });
}

function onXRFrame(timestamp, frame) {
  if (!frame) return;
  var t = clock.getElapsedTime();
  placedObjects.forEach(function(obj, i) { obj.rotation.y = t * 0.6 + i * 1.2; });

  var session = renderer.xr.getSession();
  var refSpace = renderer.xr.getReferenceSpace();

  if (!hitTestSourceRequested) {
    session.requestReferenceSpace('viewer').then(function(vs) {
      session.requestHitTestSource({ space: vs }).then(function(src) { hitTestSource = src; });
    });
    hitTestSourceRequested = true;
  }

  if (hitTestSource) {
    var results = frame.getHitTestResults(hitTestSource);
    if (results.length > 0) {
      var pose = results[0].getPose(refSpace);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);
      document.getElementById('placeBtn').disabled = false;
      if (!surfaceFound) {
        surfaceFound = true;
        document.getElementById('reticleHint').textContent = 'Surface found — press PLACE';
        setStatus('Surface detected ✦');
      }
    } else {
      reticle.visible = false;
      document.getElementById('placeBtn').disabled = true;
      surfaceFound = false;
      document.getElementById('reticleHint').textContent = 'Searching for surface...';
      setStatus('Move camera to detect surface');
    }
  }
  renderer.render(scene, camera3d);
}

function placeModel() {
  if (!reticle.visible || !loadedModel) return;
  var clone = loadedModel.clone();
  var pos = new THREE.Vector3(), quat = new THREE.Quaternion(), sc = new THREE.Vector3();
  reticle.matrix.decompose(pos, quat, sc);
  clone.position.copy(pos); clone.quaternion.copy(quat);
  scene.add(clone); placedObjects.push(clone); placedCount++;
  document.getElementById('placedBadge').textContent = placedCount + ' placed';
  var btn = document.getElementById('placeBtn');
  btn.textContent = 'PLACED ✦'; btn.style.background = 'var(--green)'; btn.style.color = '#000';
  setTimeout(function() { btn.textContent = 'PLACE'; btn.style.background = ''; btn.style.color = ''; }, 700);
}

function endAR() {
  if (xrSession) { xrSession.end().catch(function(){}); xrSession = null; }
  hitTestSource = null; hitTestSourceRequested = false; surfaceFound = false;
  placedObjects = []; placedCount = 0;
  if (renderer && renderer.domElement) renderer.domElement.remove();
  renderer = null;
  document.getElementById('arOverlay').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
  document.getElementById('placeBtn').disabled = true;
  document.getElementById('placedBadge').textContent = '';
  document.getElementById('reticleHint').textContent = 'Searching for surface...';
}

function showError(title, msg, detail) {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('errMsg').textContent = msg;
  document.getElementById('errDetail').textContent = detail || '';
  document.querySelector('#errorModal h2').textContent = title;
  document.getElementById('errorModal').style.display = 'flex';
}

function closeError() {
  document.getElementById('errorModal').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
}

function setStatus(t) { document.getElementById('statusText').textContent = t; }
</script>
</body>
</html>
