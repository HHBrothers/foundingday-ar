<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AZM AR Experience</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--blue:#1f2adf;--cyan:#00b7ff;--green:#89d957;--dark:#04060f;}
  body{background:var(--dark);color:#fff;font-family:'Share Tech Mono',monospace;overflow:hidden;height:100vh;width:100vw;}
  #landing{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,183,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,183,255,.06) 1px,transparent 1px);background-size:44px 44px;animation:gridMove 10s linear infinite;pointer-events:none;}
  @keyframes gridMove{from{background-position:0 0}to{background-position:44px 44px}}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;}
  .orb1{width:400px;height:400px;background:var(--blue);top:-100px;left:-100px;opacity:.3;animation:op 5s ease-in-out infinite alternate;}
  .orb2{width:280px;height:280px;background:var(--cyan);bottom:-80px;right:-80px;opacity:.2;animation:op 5s ease-in-out infinite alternate;animation-delay:2s;}
  @keyframes op{from{opacity:.15}to{opacity:.35}}
  .logo-wrap{position:relative;text-align:center;opacity:0;animation:fadeUp .7s ease .3s forwards;}
  .logo-azm{font-family:'Bebas Neue',sans-serif;font-size:clamp(100px,24vw,190px);line-height:.88;letter-spacing:6px;background:linear-gradient(135deg,var(--blue) 0%,var(--cyan) 50%,var(--green) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 40px rgba(0,183,255,.4));}
  .logo-sub{font-size:12px;letter-spacing:5px;color:rgba(255,255,255,.3);margin-top:4px;}
  .logo-ar-tag{position:absolute;top:10px;right:-38px;font-size:10px;color:var(--green);letter-spacing:2px;border:1px solid var(--green);padding:2px 7px;animation:blink 1.8s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .tagline{font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.4);margin-top:14px;opacity:0;animation:fadeUp .7s ease .5s forwards;}
  .btn-row{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:40px;opacity:0;animation:fadeUp .7s ease .7s forwards;}
  .ar-btn{padding:20px 64px;background:transparent;border:2px solid var(--cyan);color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:all .3s;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);display:inline-block;text-align:center;text-decoration:none;}
  .ar-btn:hover{background:var(--cyan);color:var(--dark);box-shadow:0 0 40px var(--cyan);}
  .device-label{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.22);text-align:center;}
  .disclaimer{position:absolute;bottom:24px;font-size:10px;color:rgba(255,255,255,.15);letter-spacing:1px;text-align:center;padding:0 20px;line-height:1.8;opacity:0;animation:fadeUp .7s ease .9s forwards;}
</style>
</head>
<body>

<div id="landing">
  <div class="grid-bg"></div>
  <div class="orb orb1"></div><div class="orb orb2"></div>
  <div class="logo-wrap">
    <div class="logo-azm">AZM</div>
    <div class="logo-ar-tag">AR</div>
    <div class="logo-sub">AUGMENTED REALITY</div>
  </div>
  <div class="tagline">point at a surface · press place</div>
  <div class="btn-row" id="btnRow"></div>
  <div class="disclaimer" id="disclaimer"></div>
</div>

<script>
var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
var isAndroid = /Android/.test(navigator.userAgent);
var BASE_URL = 'https://hhbrothers.github.io/foundingday-ar';

var btnRow = document.getElementById('btnRow');
var disclaimer = document.getElementById('disclaimer');

if (isIOS) {
  // iOS: AR Quick Look — native Apple AR, no install needed
  btnRow.innerHTML =
    '<span class="device-label">iOS · Safari AR Quick Look</span>' +
    '<a class="ar-btn" href="base_basic_shaded.usdz" rel="ar">Launch AR</a>';
  disclaimer.textContent = 'Opens natively in iOS AR · no app needed';

} else if (isAndroid) {
  // Android: Google Scene Viewer — built into Android, no install needed
  var sceneViewerIntent =
    'intent://arvr.google.com/scene-viewer/1.0' +
    '?file=' + BASE_URL + '/base_basic_shaded.glb' +
    '&mode=ar_preferred' +
    '&title=AZM' +
    '#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;' +
    'S.browser_fallback_url=' + BASE_URL + ';end;';

  btnRow.innerHTML =
    '<span class="device-label">Android · Google AR</span>' +
    '<a class="ar-btn" id="androidBtn" href="' + sceneViewerIntent + '">Launch AR</a>';
  disclaimer.textContent = 'Opens in Google AR · no install needed';

} else {
  // Desktop
  btnRow.innerHTML =
    '<span class="device-label">Open on your phone for AR</span>' +
    '<div style="font-size:11px;color:rgba(255,255,255,.3);letter-spacing:2px;margin-top:8px;">iOS Safari · Android Chrome</div>';
  disclaimer.textContent = 'This experience is designed for mobile';
}
</script>
</body>
</html>
