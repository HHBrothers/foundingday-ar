<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✦ HAND AR ✦</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon: #00ffe7;
    --neon2: #ff00c8;
    --dark: #050510;
    --mid: #0d0d2b;
  }

  body {
    background: var(--dark);
    color: white;
    font-family: 'Space Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* LANDING SCREEN */
  #landing {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--dark);
    z-index: 100;
    gap: 0;
  }

  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,231,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,231,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 8s linear infinite;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    animation: pulse 4s ease-in-out infinite alternate;
  }

  .orb1 { width: 400px; height: 400px; background: var(--neon); top: -100px; left: -100px; }
  .orb2 { width: 300px; height: 300px; background: var(--neon2); bottom: -80px; right: -80px; animation-delay: 2s; }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.2; }
    100% { transform: scale(1.2); opacity: 0.4; }
  }

  .title-wrap {
    position: relative;
    text-align: center;
    z-index: 2;
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--neon);
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.2s forwards;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(72px, 18vw, 160px);
    line-height: 0.9;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #fff 30%, var(--neon) 70%, var(--neon2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  .sub {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
    margin-top: 16px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.6s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hand-icon {
    font-size: 80px;
    margin: 32px 0;
    animation: float 3s ease-in-out infinite, fadeUp 0.8s ease 0.8s both;
    display: block;
    filter: drop-shadow(0 0 20px var(--neon));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }

  .start-btn {
    position: relative;
    z-index: 2;
    margin-top: 8px;
    padding: 18px 56px;
    background: transparent;
    border: 2px solid var(--neon);
    color: var(--neon);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    opacity: 0;
    animation: fadeUp 0.8s ease 1s forwards;
  }

  .start-btn:hover {
    background: var(--neon);
    color: var(--dark);
    box-shadow: 0 0 40px var(--neon), 0 0 80px rgba(0,255,231,0.3);
    transform: scale(1.05);
  }

  .start-btn:active { transform: scale(0.97); }

  .disclaimer {
    position: absolute;
    bottom: 24px;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.2s forwards;
  }

  /* AR SCREEN */
  #ar-screen {
    position: fixed; inset: 0;
    display: none;
  }

  #videoEl {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  #arCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    transform: scaleX(-1);
  }

  #threeCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* HUD */
  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .hud-corner {
    position: absolute;
    width: 24px; height: 24px;
    border-color: var(--neon);
    border-style: solid;
    opacity: 0.6;
  }
  .hud-corner.tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
  .hud-corner.tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
  .hud-corner.bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
  .hud-corner.br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }

  .hud-status {
    position: absolute;
    top: 24px; left: 50%; transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--neon);
    text-transform: uppercase;
    background: rgba(0,255,231,0.08);
    border: 1px solid rgba(0,255,231,0.2);
    padding: 6px 16px;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }

  #statusText { display: inline-block; }

  .scanning-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    animation: scan 3s linear infinite;
    opacity: 0.4;
    pointer-events: none;
  }

  @keyframes scan {
    0% { top: 0%; opacity: 0; }
    5% { opacity: 0.4; }
    95% { opacity: 0.4; }
    100% { top: 100%; opacity: 0; }
  }

  .hud-bottom {
    position: absolute;
    bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
    pointer-events: all;
  }

  .model-btn {
    padding: 10px 20px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,255,231,0.3);
    color: rgba(255,255,255,0.7);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    backdrop-filter: blur(10px);
  }

  .model-btn.active, .model-btn:hover {
    border-color: var(--neon);
    color: var(--neon);
    background: rgba(0,255,231,0.1);
    box-shadow: 0 0 16px rgba(0,255,231,0.2);
  }

  .back-btn {
    position: absolute;
    top: 20px; left: 20px;
    z-index: 20;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.6);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 8px 14px;
    cursor: pointer;
    pointer-events: all;
    backdrop-filter: blur(10px);
    transition: all 0.2s;
  }

  .back-btn:hover { border-color: var(--neon2); color: var(--neon2); }

  /* LOADING */
  #loadingScreen {
    position: fixed; inset: 0;
    background: var(--dark);
    z-index: 200;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
    display: none;
  }

  .loader-ring {
    width: 60px; height: 60px;
    border: 2px solid rgba(0,255,231,0.1);
    border-top-color: var(--neon);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--neon);
    text-transform: uppercase;
  }

  /* Hand detected flash */
  .hand-flash {
    position: absolute; inset: 0;
    border: 3px solid var(--neon);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
    box-shadow: inset 0 0 60px rgba(0,255,231,0.15);
  }
  .hand-flash.visible { opacity: 1; }
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing">
  <div class="grid-bg"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="title-wrap">
    <div class="eyebrow">✦ WebAR Experience ✦</div>
    <h1>HAND<br>AR</h1>
    <div class="sub">point your camera at your hand</div>
  </div>

  <span class="hand-icon">🖐️</span>

  <button class="start-btn" onclick="startAR()">
    Launch AR
  </button>

  <div class="disclaimer">requires camera permission · works best in good lighting</div>
</div>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="loader-ring"></div>
  <div class="loader-text" id="loadingText">Loading AI models...</div>
</div>

<!-- AR -->
<div id="ar-screen">
  <video id="videoEl" playsinline autoplay muted></video>
  <canvas id="arCanvas"></canvas>
  <canvas id="threeCanvas"></canvas>

  <div class="scanning-line"></div>
  <div class="hand-flash" id="handFlash"></div>

  <div class="hud">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
    <div class="hud-status"><span id="statusText">Scanning for hand...</span></div>
  </div>

  <button class="back-btn" onclick="goBack()">← Back</button>

  <div class="hud-bottom">
    <button class="model-btn active" id="btn0" onclick="setModel(0)">GEM</button>
    <button class="model-btn" id="btn1" onclick="setModel(1)">ROBOT</button>
    <button class="model-btn" id="btn2" onclick="setModel(2)">PORTAL</button>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let scene, camera3d, renderer, modelGroup;
let currentModelType = 0;
let handDetected = false;
let mpCamera = null;
let animFrameId = null;

// ---------- UI ----------
function startAR() {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('loadingScreen').style.display = 'flex';
  initThree();
  initMediaPipe();
}

function goBack() {
  if (mpCamera) mpCamera.stop();
  if (animFrameId) cancelAnimationFrame(animFrameId);
  document.getElementById('ar-screen').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
  // Stop camera stream
  const video = document.getElementById('videoEl');
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
}

function setModel(idx) {
  currentModelType = idx;
  [0,1,2].forEach(i => {
    document.getElementById('btn'+i).classList.toggle('active', i === idx);
  });
  buildModel(idx);
}

function setStatus(txt, color='#00ffe7') {
  const el = document.getElementById('statusText');
  el.textContent = txt;
  el.style.color = color;
}

// ---------- THREE.JS ----------
function initThree() {
  const canvas = document.getElementById('threeCanvas');
  scene = new THREE.Scene();
  camera3d = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera3d.position.z = 5;

  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  // Lights
  const amb = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0x00ffe7, 1.5);
  dir.position.set(1, 2, 3);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xff00c8, 1.0);
  dir2.position.set(-2, -1, 1);
  scene.add(dir2);
  const point = new THREE.PointLight(0xffffff, 0.8, 20);
  point.position.set(0, 3, 3);
  scene.add(point);

  modelGroup = new THREE.Group();
  scene.add(modelGroup);

  buildModel(0);
  animateThree();

  window.addEventListener('resize', () => {
    camera3d.aspect = window.innerWidth / window.innerHeight;
    camera3d.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function buildModel(type) {
  while(modelGroup.children.length) modelGroup.remove(modelGroup.children[0]);

  if (type === 0) buildGem();
  else if (type === 1) buildRobot();
  else if (type === 2) buildPortal();
}

function buildGem() {
  // Crystal gem
  const geo = new THREE.OctahedronGeometry(0.5, 0);
  const mat = new THREE.MeshPhongMaterial({
    color: 0x00ffe7,
    emissive: 0x004444,
    specular: 0xffffff,
    shininess: 200,
    transparent: true,
    opacity: 0.85,
    wireframe: false,
  });
  const gem = new THREE.Mesh(geo, mat);
  modelGroup.add(gem);

  // Inner glow core
  const innerGeo = new THREE.OctahedronGeometry(0.25, 0);
  const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
  modelGroup.add(new THREE.Mesh(innerGeo, innerMat));

  // Wireframe overlay
  const wireMat = new THREE.MeshBasicMaterial({ color: 0x00ffe7, wireframe: true, transparent: true, opacity: 0.3 });
  modelGroup.add(new THREE.Mesh(new THREE.OctahedronGeometry(0.52, 0), wireMat));

  // Orbiting ring
  const ringGeo = new THREE.TorusGeometry(0.75, 0.02, 8, 40);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xff00c8 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.name = 'ring';
  modelGroup.add(ring);
}

function buildRobot() {
  const mat = (color, emissive=0x001100) => new THREE.MeshPhongMaterial({ color, emissive, specular: 0xaaffaa, shininess: 80 });

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.35), mat(0x33ff77, 0x003300));
  body.position.y = 0.1;
  modelGroup.add(body);

  // Head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.35, 0.3), mat(0x22cc66, 0x002200));
  head.position.y = 0.6;
  head.name = 'head';
  modelGroup.add(head);

  // Eyes
  [-0.1, 0.1].forEach(x => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0x00ffe7 }));
    eye.position.set(x, 0.62, 0.16);
    modelGroup.add(eye);

    // Eye glow
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0x00ffe7, transparent: true, opacity: 0.15 }));
    glow.position.copy(eye.position);
    modelGroup.add(glow);
  });

  // Arms
  [-0.35, 0.35].forEach(x => {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.15), mat(0x22aa55));
    arm.position.set(x, 0.05, 0);
    arm.name = 'arm_' + (x < 0 ? 'l' : 'r');
    modelGroup.add(arm);
  });

  // Chest light
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.05),
    new THREE.MeshBasicMaterial({ color: 0xff00c8 }));
  chest.position.set(0, 0.15, 0.18);
  modelGroup.add(chest);

  // Legs
  [-0.13, 0.13].forEach(x => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.3, 0.18), mat(0x1a9944));
    leg.position.set(x, -0.28, 0);
    modelGroup.add(leg);
  });
}

function buildPortal() {
  // Outer ring
  const ringGeo = new THREE.TorusGeometry(0.65, 0.06, 16, 60);
  const ringMat = new THREE.MeshPhongMaterial({ color: 0xff00c8, emissive: 0x440033, specular: 0xffffff, shininess: 150 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  modelGroup.add(ring);

  // Inner ring
  const ring2Geo = new THREE.TorusGeometry(0.5, 0.03, 12, 50);
  const ring2Mat = new THREE.MeshBasicMaterial({ color: 0x00ffe7 });
  modelGroup.add(new THREE.Mesh(ring2Geo, ring2Mat));

  // Portal surface
  const diskGeo = new THREE.CircleGeometry(0.62, 64);
  const diskMat = new THREE.MeshBasicMaterial({
    color: 0x110022,
    transparent: true,
    opacity: 0.85,
    side: THREE.DoubleSide,
  });
  modelGroup.add(new THREE.Mesh(diskGeo, diskMat));

  // Spiral particles around ring
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 6, 6),
      new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xff00c8 : 0x00ffe7 })
    );
    dot.position.set(Math.cos(a) * 0.65, Math.sin(a) * 0.65, 0);
    dot.name = 'dot_' + i;
    modelGroup.add(dot);
  }

  // Stars inside portal
  for (let i = 0; i < 30; i++) {
    const star = new THREE.Mesh(
      new THREE.SphereGeometry(0.015, 4, 4),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: Math.random() * 0.8 + 0.2 })
    );
    const r = Math.random() * 0.55;
    const a = Math.random() * Math.PI * 2;
    star.position.set(Math.cos(a) * r, Math.sin(a) * r, 0.01);
    star.name = 'star_' + i;
    modelGroup.add(star);
  }
}

let clock = new THREE.Clock();

function animateThree() {
  animFrameId = requestAnimationFrame(animateThree);
  const t = clock.getElapsedTime();

  if (modelGroup) {
    if (currentModelType === 0) {
      // Gem: bob + rotate
      modelGroup.rotation.y = t * 1.2;
      modelGroup.rotation.z = Math.sin(t * 0.7) * 0.15;
      const ring = modelGroup.getObjectByName('ring');
      if (ring) ring.rotation.x = t * 2;

    } else if (currentModelType === 1) {
      // Robot: gentle sway + head bob
      modelGroup.rotation.y = Math.sin(t * 0.8) * 0.3;
      const head = modelGroup.getObjectByName('head');
      if (head) head.rotation.y = Math.sin(t * 1.5) * 0.3;
      modelGroup.children.forEach(c => {
        if (c.name === 'arm_l') c.rotation.x = Math.sin(t * 2) * 0.4;
        if (c.name === 'arm_r') c.rotation.x = Math.sin(t * 2 + Math.PI) * 0.4;
      });

    } else if (currentModelType === 2) {
      // Portal: spin + particle orbit
      modelGroup.rotation.z = t * 0.5;
      for (let i = 0; i < 12; i++) {
        const dot = modelGroup.getObjectByName('dot_' + i);
        if (dot) {
          const a = (i / 12) * Math.PI * 2 + t * 1.5;
          dot.position.set(Math.cos(a) * 0.65, Math.sin(a) * 0.65, 0);
        }
      }
      // Twinkle stars
      for (let i = 0; i < 30; i++) {
        const star = modelGroup.getObjectByName('star_' + i);
        if (star) star.material.opacity = 0.3 + Math.sin(t * 3 + i) * 0.5;
      }
    }

    // If hand detected: scale up, else scale down
    const targetScale = handDetected ? 1.0 : 0.0;
    modelGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.15);
  }

  renderer.render(scene, camera3d);
}

// ---------- MEDIAPIPE ----------
function initMediaPipe() {
  const videoEl = document.getElementById('videoEl');
  const arCanvas = document.getElementById('arCanvas');
  const ctx = arCanvas.getContext('2d');

  const hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6,
  });

  hands.onResults(results => {
    // Resize canvas to match video
    arCanvas.width = videoEl.videoWidth || window.innerWidth;
    arCanvas.height = videoEl.videoHeight || window.innerHeight;

    ctx.save();
    ctx.clearRect(0, 0, arCanvas.width, arCanvas.height);

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      handDetected = true;
      document.getElementById('handFlash').classList.add('visible');
      setStatus('Hand Detected ✦', '#00ffe7');

      const lm = results.multiHandLandmarks[0];

      // Draw skeleton
      drawHandSkeleton(ctx, lm, arCanvas.width, arCanvas.height);

      // Get palm center (landmark 9 = middle finger base)
      const palmX = lm[9].x;
      const palmY = lm[9].y;
      const palmZ = lm[9].z;

      // Estimate scale from wrist-to-middle-finger distance
      const wrist = lm[0];
      const mid = lm[9];
      const dist = Math.sqrt(
        Math.pow((mid.x - wrist.x) * arCanvas.width, 2) +
        Math.pow((mid.y - wrist.y) * arCanvas.height, 2)
      );

      // Map palm position to 3D space
      const x3d = (palmX - 0.5) * -8;
      const y3d = (palmY - 0.5) * -6;
      const scaleFactor = dist / 80;

      modelGroup.position.lerp(new THREE.Vector3(x3d, y3d + 1.2, 0), 0.3);
      const s = Math.max(0.4, Math.min(2.5, scaleFactor));
      modelGroup.scale.lerp(new THREE.Vector3(s, s, s), 0.2);

    } else {
      handDetected = false;
      document.getElementById('handFlash').classList.remove('visible');
      setStatus('Scanning for hand...', '#00ffe7');
      modelGroup.scale.lerp(new THREE.Vector3(0, 0, 0), 0.1);
    }

    ctx.restore();
  });

  mpCamera = new Camera(videoEl, {
    onFrame: async () => {
      await hands.send({ image: videoEl });
    },
    width: 1280,
    height: 720,
    facingMode: 'environment' // Use back camera on mobile
  });

  mpCamera.start().then(() => {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('ar-screen').style.display = 'block';
    setStatus('Show your hand ✦');
  }).catch(err => {
    document.getElementById('loadingText').textContent = 'Camera error: ' + err.message;
  });
}

function drawHandSkeleton(ctx, lm, w, h) {
  const connections = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],
    [5,9],[9,13],[13,17]
  ];

  // Bones
  ctx.strokeStyle = 'rgba(0,255,231,0.5)';
  ctx.lineWidth = 2;
  connections.forEach(([a, b]) => {
    ctx.beginPath();
    ctx.moveTo(lm[a].x * w, lm[a].y * h);
    ctx.lineTo(lm[b].x * w, lm[b].y * h);
    ctx.stroke();
  });

  // Joints
  lm.forEach((pt, i) => {
    const x = pt.x * w, y = pt.y * h;
    const isTip = [4,8,12,16,20].includes(i);

    ctx.beginPath();
    ctx.arc(x, y, isTip ? 6 : 4, 0, Math.PI * 2);
    ctx.fillStyle = isTip ? 'rgba(255,0,200,0.9)' : 'rgba(0,255,231,0.9)';
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(x, y, isTip ? 12 : 8, 0, Math.PI * 2);
    ctx.fillStyle = isTip ? 'rgba(255,0,200,0.15)' : 'rgba(0,255,231,0.1)';
    ctx.fill();
  });
}
